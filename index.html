<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한라대학교 - 날씨 & 명언 시작 페이지</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><path d='M8 6h24v20c0 8-12 12-12 12S8 34 8 26V6z' fill='%230f172a'/><text x='20' y='25' fill='%2300b4d8' font-size='16' font-family='sans-serif' font-weight='bold' text-anchor='middle'>30</text></svg>">
</head>
<body>
  <div class="page-container">

    <!-- 1. 상단 한라대학교 공식 홈페이지 연결 로고 카드 -->
    <header class="halla-header-wrap">
      <a href="https://www.halla.ac.kr" class="halla-card" target="_blank" rel="noopener noreferrer" title="한라대학교 공식 홈페이지 바로가기">
        <div class="halla-emblem">
          <!-- 30주년 엠블럼 방패 심볼 -->
          <svg viewBox="0 0 54 62" width="44" height="50" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 6C4 4.89543 4.89543 4 6 4H48C49.1046 4 50 4.89543 50 6V36C50 48.5 27 58 27 58C27 58 4 48.5 4 36V6Z" fill="#111827"/>
            <path d="M8 8H46V35C46 45 27 53 27 53C27 53 8 45 8 35V8Z" stroke="#1E293B" stroke-width="1.5"/>
            <!-- 30 텍스트 및 그라디언트 -->
            <text x="27" y="34" fill="#00A8FF" font-family="'Pretendard', sans-serif" font-weight="800" font-size="22" text-anchor="middle" letter-spacing="-1">30</text>
            <text x="27" y="44" fill="#94A3B8" font-family="'Pretendard', sans-serif" font-weight="600" font-size="7.5" text-anchor="middle" letter-spacing="1.5">HALLA</text>
          </svg>
        </div>
        <div class="halla-brand-text">
          <span class="univ-ko">한라대학교</span>
          <span class="univ-en">HALLA UNIVERSITY</span>
        </div>
      </a>
    </header>

    <!-- 2. 오늘의 날씨 섹션 (원주, 서울, 제주) -->
    <section class="weather-section" aria-label="오늘의 날씨">
      <div class="weather-top-bar">
        <h2 class="weather-title">오늘의 날씨</h2>
        <button class="refresh-btn" id="refreshWeatherBtn" title="날씨 새로고침" aria-label="날씨 새로고침">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
          </svg>
        </button>
      </div>

      <div class="weather-grid">
        <!-- 원주 -->
        <article class="weather-box" id="card-wonju">
          <div class="box-header">
            <span class="box-city">원주</span>
            <span class="box-badge">Wonju</span>
          </div>
          <div class="box-main">
            <div class="box-icon" id="icon-wonju">
              <!-- Default Sun Icon -->
              <svg viewBox="0 0 48 48" width="42" height="42">
                <circle cx="24" cy="24" r="10" fill="#F59E0B"/>
                <path d="M24 4v5M24 39v5M4 24h5M39 24h5M9.86 9.86l3.54 3.54M34.6 34.6l3.54 3.54M9.86 38.14l3.54-3.54M34.6 13.4l3.54-3.54" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="box-temp-group">
              <span class="box-temp" id="temp-wonju">0°C</span>
              <span class="box-desc" id="desc-wonju">맑음</span>
            </div>
          </div>
          <div class="box-footer">
            <span class="box-stat">습도: <strong id="humidity-wonju">57%</strong></span>
            <span class="box-stat">풍속: <strong id="wind-wonju">6.9 m/s</strong></span>
          </div>
        </article>

        <!-- 서울 -->
        <article class="weather-box" id="card-seoul">
          <div class="box-header">
            <span class="box-city">서울</span>
            <span class="box-badge">Seoul</span>
          </div>
          <div class="box-main">
            <div class="box-icon" id="icon-seoul">
              <!-- Default Sun Icon -->
              <svg viewBox="0 0 48 48" width="42" height="42">
                <circle cx="24" cy="24" r="10" fill="#F59E0B"/>
                <path d="M24 4v5M24 39v5M4 24h5M39 24h5M9.86 9.86l3.54 3.54M34.6 34.6l3.54 3.54M9.86 38.14l3.54-3.54M34.6 13.4l3.54-3.54" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="box-temp-group">
              <span class="box-temp" id="temp-seoul">1°C</span>
              <span class="box-desc" id="desc-seoul">맑음</span>
            </div>
          </div>
          <div class="box-footer">
            <span class="box-stat">습도: <strong id="humidity-seoul">48%</strong></span>
            <span class="box-stat">풍속: <strong id="wind-seoul">3.9 m/s</strong></span>
          </div>
        </article>

        <!-- 제주 -->
        <article class="weather-box" id="card-jeju">
          <div class="box-header">
            <span class="box-city">제주</span>
            <span class="box-badge">Jeju</span>
          </div>
          <div class="box-main">
            <div class="box-icon" id="icon-jeju">
              <!-- Default Cloud with Sun Icon -->
              <svg viewBox="0 0 48 48" width="42" height="42">
                <circle cx="18" cy="18" r="8" fill="#F59E0B"/>
                <path d="M34 38H18a9 9 0 0 1-1.6-17.86A11 11 0 0 1 37.2 24 7 7 0 0 1 34 38z" fill="#60A5FA" opacity="0.95"/>
              </svg>
            </div>
            <div class="box-temp-group">
              <span class="box-temp" id="temp-jeju">10°C</span>
              <span class="box-desc" id="desc-jeju">구름 조금</span>
            </div>
          </div>
          <div class="box-footer">
            <span class="box-stat">습도: <strong id="humidity-jeju">63%</strong></span>
            <span class="box-stat">풍속: <strong id="wind-jeju">12.2 m/s</strong></span>
          </div>
        </article>
      </div>
    </section>

    <!-- 3. 오늘의 명언 섹션 -->
    <section class="quote-section" aria-label="오늘의 명언">
      <div class="quote-panel">
        <div class="quote-badge">오늘의 명언</div>
        <p class="quote-body" id="quoteText">“우리가 두려워해야 할 유일한 것은 두려움 그 자체다.”</p>
        <span class="quote-author-name" id="quoteAuthor">— 프랭클린 D. 루스벨트</span>
        <button class="quote-refresh-btn" id="newQuoteBtn" type="button">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
            <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0 0 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 0 0 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
          </svg>
          <span>다른 명언</span>
        </button>
      </div>
    </section>

    <!-- 4. 구글 검색창 (깔끔한 카드 일체형 디자인) -->
    <section class="search-section" aria-label="구글 검색">
      <form class="search-card" action="https://www.google.com/search" method="GET" target="_self">
        <div class="search-input-wrap">
          <svg class="search-glass-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
          <input
            type="text"
            name="q"
            id="searchInput"
            class="search-field"
            placeholder="Google 검색 또는 URL 입력..."
            autocomplete="off"
            aria-label="Google 검색"
          >
          <button type="submit" class="search-submit-btn">
            <span>검색</span>
          </button>
        </div>
      </form>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
